name: Docker

# 全保真镜像构建/发布。build + 冒烟总在 CI 跑（本机不参与重构建）；仅打 v* tag 才推 GHCR。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/toki0413/saturday

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) 本地 --load 构建（复用 GHA 层缓存），供冒烟用
      - name: Build (load, for smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) 冒烟：容器里一行出真值（EMT 档；无 python 则 lj-js 底档，均应有 energyPerAtom）
      - name: Smoke — relax Cu
        run: |
          docker run --rm ${{ env.IMAGE }}:ci-test --relax Cu | tee /tmp/relax.json
          grep -q energyPerAtom /tmp/relax.json
          grep -q materialId /tmp/relax.json

      - name: Smoke — tools list
        run: |
          docker run --rm ${{ env.IMAGE }}:ci-test --tools | tee /tmp/tools.json
          grep -q potential.relax /tmp/tools.json

      # 3) 仅打 tag 时推 GHCR（缓存命中→快）
      # 版本号必须经 step output 传递：YAML 里写 ${GITHUB_REF_NAME#v} 不是 Actions 表达式，
      # 会原样拼进镜像标签并触发 invalid reference format（已于 v0.3.13 实跑撞过）。
      - name: Resolve image tag
        id: resolve-tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Push (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.resolve-tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
