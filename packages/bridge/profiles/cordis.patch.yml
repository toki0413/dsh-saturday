# Saturday 挂载到 dsh profile 的用户 patch 层示例
# 放置：$DSH_HOME/profiles/web/cordis.patch.yml（web profile 初始化后）
#
# 前提：Node ≥ 22（dsh 硬性要求，见适配清单 §0）
#
# 步骤：
#   1) 声明插件包到 profile 的 package.json dependencies 并安装：
#        { "dependencies": { "@toki0413/bridge": "file:/path/to/Saturday/packages/bridge" } }
#        cd $DSH_HOME/profiles/web && pnpm install
#      （注册表包直接用 `dsh plugin --profile web add @toki0413/bridge`；
#        本地路径经 CLI 安装有已知问题，绕过方案见适配清单 §0；
#        修改本地包的 package.json 后需"先删依赖再重新添加"以刷新快照）
#   2) 将下面的行写入 profile 的 cordis.patch.yml（注意是 - insert: 列表形式）
#   3) `dsh --profile web --dump-config` 验证组合树 → `dsh web`
#
# 平面判断（依据 dsh 官方 compositions 指南）：
#   material / potential 服务跨会话共享 → host 平面（本文件即 host 组合的用户 patch）
#   工具注册进 host 的 tools registry（ctx.tools.register，官方工具插件同路径）
#   若未来需要"每会话独立材料空间"，再将工具行移入自定义 agent preset，
#   服务行包进带 isolate realm 的 group（见适配清单 §6）

- insert:
    - id: saturday
      name: '@toki0413/bridge'
      config:
        # Python sidecar 配置（可选，默认 python3 + 包内 sidecar.py）
        # bridge:
        #   python: python3
        # 裸 cordis 环境下 Trajectory 落盘路径；dsh 内优先写 sessions 服务
        trajectoryPath: ./data/trajectory.jsonl

# 工作流插件独立挂载（契约 §4.3：工作流不进核心）：与核心插件同一组合树，
# 工具自动暴露给 Agent（workflow.screen / workflow.freeEnergy / workflow.ergodic 等）。
# 核心插件自带 Agent 工具：material.load / potential.relax / engine.availability
# （可用性预检：逐引擎探测运行时版本并如实报告，stamp=true 时盖章升级指纹实测态）。
# workflow.screen 的 evidenceSources 参数向 Agent 暴露内置证据源：
#   ["hull"]（凸包距离，需参考态）/ ["mixing-entropy"]（理想混合熵组分先验），可同启。
# 依赖的 @toki0413/plugin-* 包同样先声明到 profile 的 package.json dependencies。
# - insert:
#     - id: saturday-screening
#       name: '@toki0413/plugin-screening'
#     - id: saturday-free-energy   # 热力学第二档：构型自由能曲线（需引擎支持 md）
#       name: '@toki0413/plugin-free-energy'
#     - id: saturday-ergodic
#       name: '@toki0413/plugin-ergodic'
#     - id: saturday-derivation    # 可选：活性上下文/失效传播登记簿
#       name: '@toki0413/plugin-derivation'
